<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mondo Quiz — ZNAEDU</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #123c69, #1769aa);
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      width: min(900px, 94%);
      margin: 22px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .category-btn {
      width: 100%;
      min-height: 48px;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      background: #fff;
      color: #172033;
      padding: 10px 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .category-btn:hover {
      border-color: #1769aa;
      background: #f0f7ff;
    }

    .category-btn.active {
      background: #1769aa;
      border-color: #1769aa;
      color: white;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .level-btn {
      padding: 12px 5px;
      border: 1px solid #d8dee8;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      font-weight: 600;
    }

    .level-btn.active {
      background: #172033;
      color: white;
      border-color: #172033;
    }

    .count-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-box input {
      width: 100px;
      padding: 12px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-btn:hover {
      background: #12568e;
    }

    .secondary-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      background: #e8edf5;
      cursor: pointer;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    .question-number {
      color: #1769aa;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      padding: 14px;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    .answer-btn:hover {
      background: #f4f8fd;
      border-color: #1769aa;
    }

    .answer-btn.correct {
      background: #dff6e6;
      border-color: #28a745;
    }

    .answer-btn.wrong {
      background: #ffe2e2;
      border-color: #dc3545;
    }

    .score {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #1769aa;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 14px;
      background: #eef5ff;
      color: #174b78;
    }

    .error {
      background: #ffe8e8;
      color: #9d2020;
    }

    .success {
      background: #e4f7e9;
      color: #176b2e;
    }

    @media (max-width: 520px) {
      .categories-grid {
        gap: 7px;
      }

      .category-btn {
        min-height: 45px;
        font-size: 12px;
      }

      .levels {
        grid-template-columns: repeat(2, 1fr);
      }

      .question-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MONDO QUIZ</h1>
  <p>Teste tes connaissances dans 26 disciplines</p>
</header>

<main>

  <!-- CONFIGURATION -->
  <section id="setupSection">

    <div class="card">
      <h2>Choisis une discipline</h2>

      <div id="categoriesGrid" class="categories-grid"></div>
    </div>

    <div class="card">
      <h2>Niveau</h2>

      <div class="levels">
        <button class="level-btn" data-level="beginner">
          Débutant
        </button>

        <button class="level-btn active" data-level="intermediate">
          Intermédiaire
        </button>

        <button class="level-btn" data-level="advanced">
          Avancé
        </button>

        <button class="level-btn" data-level="expert">
          Expert
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Nombre de questions</h2>

      <div class="count-box">
        <input
          id="questionCount"
          type="number"
          min="1"
          max="100"
          value="10"
        >

        <span>Maximum : 100</span>
      </div>
    </div>

    <div id="setupMessage"></div>

    <div class="card">
      <button id="startBtn" class="primary-btn">
        Commencer le quiz
      </button>
    </div>

  </section>


  <!-- QUIZ -->
  <section id="quizSection" class="hidden">

    <div class="card">

      <div id="questionNumber" class="question-number"></div>

      <div id="questionText" class="question-text"></div>

      <div id="answers" class="answers"></div>

      <br>

      <button
        id="nextBtn"
        class="primary-btn hidden">
        Question suivante
      </button>

    </div>

  </section>


  <!-- RESULTAT -->
  <section id="resultSection" class="hidden">

    <div class="card">

      <h2 style="text-align:center;">
        Résultat
      </h2>

      <div id="score" class="score"></div>

      <p id="resultDetails" style="text-align:center;"></p>

      <button
        id="restartBtn"
        class="primary-btn">
        Recommencer
      </button>

    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://dpxghtjhjylofxhmnfxf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QklC1lULFCU5wsl52CgNQg_V1iKQKEs";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   26 DISCIPLINES
===================================================== */

const categories = [
  "Culture générale",
  "Français",
  "Géographie",
  "Histoire",
  "Mathématiques",
  "Sciences",

  "Athlétisme",
  "Philosophie",
  "Football",
  "Basket-ball",
  "Tennis",
  "Handball",
  "Volleyball",
  "Cyclisme",
  "Natation",

  "Littérature",
  "Musique",
  "Cinéma",
  "Informatique",
  "Technologie",
  "Économie",
  "Entrepreneuriat",
  "Psychologie",
  "Environnement",
  "Astronomie",
  "Agriculture"
];


/* =====================================================
   ETAT
===================================================== */

let selectedCategory = null;

let selectedLevel =
  "intermediate";

let questions = [];

let currentQuestion = 0;

let score = 0;

let sessionId = null;

let answered = false;


/* =====================================================
   ELEMENTS
===================================================== */

const categoriesGrid =
  document.getElementById("categoriesGrid");

const setupSection =
  document.getElementById("setupSection");

const quizSection =
  document.getElementById("quizSection");

const resultSection =
  document.getElementById("resultSection");

const setupMessage =
  document.getElementById("setupMessage");

const questionCount =
  document.getElementById("questionCount");

const startBtn =
  document.getElementById("startBtn");

const nextBtn =
  document.getElementById("nextBtn");

const restartBtn =
  document.getElementById("restartBtn");

const questionNumber =
  document.getElementById("questionNumber");

const questionText =
  document.getElementById("questionText");

const answers =
  document.getElementById("answers");

const scoreElement =
  document.getElementById("score");

const resultDetails =
  document.getElementById("resultDetails");


/* =====================================================
   AFFICHAGE DES DISCIPLINES
===================================================== */

categories.forEach(category => {

  const button =
    document.createElement("button");

  button.type = "button";

  button.className =
    "category-btn";

  button.textContent =
    category;

  button.addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(".category-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      selectedCategory =
        category;

    }
  );

  categoriesGrid.appendChild(button);

});


/* =====================================================
   NIVEAUX
===================================================== */

document
  .querySelectorAll(".level-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".level-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        button.classList.add("active");

        selectedLevel =
          button.dataset.level;

      }
    );

  });


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  message,
  type = ""
) {

  setupMessage.className =
    "status " + type;

  setupMessage.textContent =
    message;

}


/* =====================================================
   DEMARRER LE QUIZ
===================================================== */

startBtn.addEventListener(
  "click",
  startQuiz
);


async function startQuiz() {

  if (!selectedCategory) {

    showMessage(
      "Choisis d'abord une discipline.",
      "error"
    );

    return;
  }


  let count =
    parseInt(
      questionCount.value,
      10
    );


  if (
    isNaN(count) ||
    count < 1 ||
    count > 100
  ) {

    showMessage(
      "Le nombre de questions doit être compris entre 1 et 100.",
      "error"
    );

    return;
  }


  startBtn.disabled = true;

  startBtn.textContent =
    "Chargement...";


  showMessage(
    "Préparation du quiz..."
  );


  try {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "mondo_quiz_start",
      {
        p_category:
          selectedCategory,

        p_difficulty:
          selectedLevel,

        p_question_count:
          count
      }
    );


    if (error)
      throw error;


    if (
      !data ||
      !data.questions ||
      data.questions.length === 0
    ) {

      throw new Error(
        "Aucune question disponible pour cette discipline et ce niveau."
      );

    }


    sessionId =
      data.session_id;

    questions =
      data.questions;

    currentQuestion = 0;

    score = 0;

    answered = false;


    setupSection
      .classList
      .add("hidden");

    resultSection
      .classList
      .add("hidden");

    quizSection
      .classList
      .remove("hidden");


    displayQuestion();

  }
  catch(error) {

    console.error(error);

    showMessage(
      error.message ||
      "Impossible de démarrer le quiz.",
      "error"
    );

  }
  finally {

    startBtn.disabled =
      false;

    startBtn.textContent =
      "Commencer le quiz";

  }

}


/* =====================================================
   AFFICHER QUESTION
===================================================== */

function displayQuestion() {

  const question =
    questions[currentQuestion];


  answered = false;

  nextBtn
    .classList
    .add("hidden");


  questionNumber.textContent =
    `Question ${currentQuestion + 1} / ${questions.length}`;


  questionText.textContent =
    question.question;


  answers.innerHTML =
    "";


  const options =
    question.options || [];


  options.forEach(option => {

    const button =
      document.createElement("button");

    button.type =
      "button";

    button.className =
      "answer-btn";

    button.textContent =
      option.text ||
      option.label ||
      option.answer ||
      "";


    button.addEventListener(
      "click",
      () => {

        submitAnswer(
          option,
          button
        );

      }
    );


    answers.appendChild(button);

  });

}


/* =====================================================
   REPONSE
===================================================== */

async function submitAnswer(
  option,
  clickedButton
) {

  if (answered)
    return;


  answered = true;


  document
    .querySelectorAll(".answer-btn")
    .forEach(btn =>
      btn.disabled = true
    );


  const question =
    questions[currentQuestion];


  let answerValue =
    option.value ??
    option.text ??
    option.label ??
    option.answer ??
    "";


  try {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "mondo_quiz_submit_answer",
      {
        p_session_id:
          sessionId,

        p_question_id:
          question.id,

        p_answer:
          String(answerValue)
      }
    );


    if (error)
      throw error;


    if (data?.is_correct) {

      clickedButton
        .classList
        .add("correct");

      score++;

    }
    else {

      clickedButton
        .classList
        .add("wrong");

    }


    nextBtn
      .classList
      .remove("hidden");


  }
  catch(error) {

    console.error(error);

    clickedButton
      .classList
      .add("wrong");

    nextBtn
      .classList
      .remove("hidden");

  }

}


/* =====================================================
   QUESTION SUIVANTE
===================================================== */

nextBtn.addEventListener(
  "click",
  () => {

    currentQuestion++;

    if (
      currentQuestion >=
      questions.length
    ) {

      showResult();

      return;
    }

    displayQuestion();

  }
);


/* =====================================================
   RESULTAT
===================================================== */

function showResult() {

  quizSection
    .classList
    .add("hidden");

  resultSection
    .classList
    .remove("hidden");


  const total =
    questions.length;


  const percentage =
    Math.round(
      (score / total) * 100
    );


  scoreElement.textContent =
    `${score} / ${total}`;


  resultDetails.textContent =
    `${percentage}% de réussite — ${selectedCategory}`;

}


/* =====================================================
   RECOMMENCER
===================================================== */

restartBtn.addEventListener(
  "click",
  () => {

    resultSection
      .classList
      .add("hidden");

    setupSection
      .classList
      .remove("hidden");

    setupMessage.textContent =
      "";

    questionCount.value =
      10;

  }
);

</script>

</body>
</html>
