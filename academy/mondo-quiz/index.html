}

.card:hover{

.card-icon{

}

.card-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:5px;
}

.card-code{

  color:var(--blue);
  border-radius:6px;
  padding:3px 7px;
  font-size:11px;
  font-weight:800;
  margin-bottom:6px;
}

.card-info{
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.section{
  margin-top:25px;
}

.section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:11px;
}

.question-box{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 15px rgba(20,70,120,.05);
}

.question-number{
  color:var(--blue);
  font-weight:800;
  font-size:13px;
  margin-bottom:12px;
}

.question-text{
  font-size:20px;
  line-height:1.45;
  font-weight:700;
  margin-bottom:18px;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:13px 15px;
  cursor:pointer;
  color:var(--dark);
}

.answer:hover{
  border-color:#80b6ec;
  background:#f5faff;
}

.answer.correct{
  border-color:#4caf78;
  background:#effbf4;
}

.answer.wrong{
  border-color:#e09b9b;
  background:#fff4f4;
}

.explanation{
  margin-top:16px;
  padding:13px;
  background:#f2f8ff;
  border-radius:10px;
  color:#35546f;
  line-height:1.5;
  display:none;
}

.next{
  margin-top:16px;
  border:0;
  background:var(--blue);
  color:white;
  border-radius:10px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
  display:none;
}

  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  color:var(--muted);
  margin-bottom:18px;

.loading{

.badge{

  level:null,
  classItem:null,

  topic:null,
  questions:[],
  questionIndex:0,
  score:0,
  answered:false

/* =========================================================
   4. OUTILS
========================================================= */

const app = document.getElementById("app");
const breadcrumb = document.getElementById("breadcrumb");

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeProgram(program){

  if(!program.classes){
    return program;
  }

  if(!Array.isArray(program.classes)){
    return program;
  }

  return program;
}

function getLevel(){
  return catalog.find(x=>x.id===state.level);
}

function getClass(){
  const level=getLevel();
  if(!level) return null;

  return level.classes.find(
    x=>typeof x==="object" && x.code===state.classItem
  );
}

function getDiscipline(){
  const cls=getClass();
  if(!cls) return null;

  return cls.disciplines.find(
    x=>x.code===state.discipline
  );
}

function setBreadcrumb(items){

  breadcrumb.innerHTML = items.map((item,index)=>{

    if(index===items.length-1){
      return `<span class="crumb active">${escapeHtml(item.label)}</span>`;
    }

    return `
      <span
        class="crumb"
        onclick="${item.action}"
      >
        ${escapeHtml(item.label)}
      </span>
      <span class="crumb-separator">›</span>
    `;

  }).join("");
}


/* =========================================================
   5. ÉCRAN 1 — NIVEAUX
========================================================= */

function renderLevels(){

  state.level=null;
  state.classItem=null;
  state.discipline=null;
  state.topic=null;

  setBreadcrumb([
    {label:"Mondo Quiz",action:"renderLevels()"},
    {label:"Choisir un niveau"}
  ]);

  app.innerHTML=`

    <h1 class="screen-title">Choisis ton niveau</h1>

    <p class="screen-description">
      Sélectionne d'abord le niveau d'enseignement. 
      Les classes correspondant à ce niveau apparaîtront ensuite.
    </p>

    <div class="grid">

      ${catalog.map(level=>`

        <div
          class="card"
          onclick="selectLevel('${level.id}')"
        >

          <div class="card-icon">${level.icon}</div>

          <div class="card-title">
            ${escapeHtml(level.name)}
          </div>

          <div class="card-info">
            ${escapeHtml(level.description)}
          </div>

        </div>

      `).join("")}

    </div>
  `;
}

    </h1>

    <p class="screen-description">
      Choisis maintenant la classe ou le parcours correspondant.
    </p>

    <div class="grid">

      ${level.classes.map(cls=>{

        if(typeof cls==="string"){
          return `
            <div
              class="card"
              onclick="selectClass('${cls}')"
            >

              <div class="card-title">${escapeHtml(cls)}</div>
              <div class="card-info">
                Voir les disciplines de cette classe
              </div>
            </div>
          `;
        }

        return `
          <div
            class="card"
            onclick="selectClass('${cls.code}')"
          >
            <div class="card-icon">📚</div>

            <div class="card-code">
              ${escapeHtml(cls.code)}
            </div>

            <div class="card-title">
              ${escapeHtml(cls.name)}
            </div>

            <div class="card-info">
              ${cls.disciplines.length} discipline(s)
            </div>
          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* =========================================================
   7. ÉCRAN 3 — DISCIPLINES
========================================================= */

function selectClass(classCode){

  state.classItem=classCode;
  state.discipline=null;
  state.topic=null;

  const level=getLevel();

  let cls = level.classes.find(
    x=>typeof x==="object" && x.code===classCode
  );

  /*
    Pour les classes secondaires générées simplement,
    elles sont déjà des objets.
  */

  if(!cls){
    return showMessage("Cette classe ne contient pas encore de structure.");
  }

  setBreadcrumb([
    {label:"Mondo Quiz",action:"renderLevels()"},
    {label:level.name,action:`selectLevel('${level.id}')`},
    {label:cls.name}
  ]);

  app.innerHTML=`

    <button
      class="back"
      onclick="selectLevel('${level.id}')"
    >
      ← Retour aux classes
    </button>

    <h1 class="screen-title">
      ${escapeHtml(cls.name)}
    </h1>

    <p class="screen-description">
      Choisis maintenant la discipline dans laquelle tu veux travailler.
    </p>

    <div class="grid">

      ${cls.disciplines.map(d=>`

        <div
          class="card"
          onclick="selectDiscipline('${d.code}')"
        >

          <div class="card-icon">
            ${d.icon || "📚"}
          </div>

          <div class="card-title">
            ${escapeHtml(d.name)}
          </div>

          <div class="card-info">
            ${d.topics?.length || 0} thème(s)
            ${d.questions?.length ? 
              ` • ${d.questions.length} question(s)` : ""}
          </div>

        </div>

      `).join("")}

    </div>
  `;
}


/* =========================================================
   8. ÉCRAN 4 — DISCIPLINE / THÈMES
========================================================= */

function selectDiscipline(code){

  state.discipline=code;
  state.topic=null;

  const level=getLevel();
  const cls=getClass();
  const discipline=getDiscipline();

  if(!discipline){
    return showMessage("Discipline introuvable.");
  }

  setBreadcrumb([
    {label:"Mondo Quiz",action:"renderLevels()"},
    {label:level.name,action:`selectLevel('${level.id}')`},
    {label:cls.name,action:`selectClass('${cls.code}')`},
    {label:discipline.name}
  ]);

  const questions = discipline.questions || [];

  app.innerHTML=`

    <button
      class="back"
      onclick="selectClass('${cls.code}')"
    >
      ← Retour aux disciplines
    </button>

    <h1 class="screen-title">
      ${discipline.icon || "📚"} ${escapeHtml(discipline.name)}
    </h1>

    <p class="screen-description">
      Choisis un thème ou lance directement les questions disponibles.
    </p>

    ${
      questions.length
      ?
      `
        <div class="section">

          <div class="section-title">
            Questions disponibles
          </div>

          <div
            class="card"
            onclick="startQuestions()"
          >
            <div class="card-icon">📝</div>
            <div class="card-title">
              Commencer les questions
            </div>
            <div class="card-info">
              ${questions.length} question(s) disponible(s)
            </div>
          </div>

        </div>
      `
      :
      `
        <div class="status">
          Les questions de cette discipline seront chargées depuis
          le catalogue pédagogique Mondo Quiz.
        </div>
      `
    }

    ${
      discipline.topics?.length
      ?
      `
        <div class="section">

          <div class="section-title">
            Thèmes de la discipline
          </div>

          <div class="grid">

            ${discipline.topics.map((topic,index)=>`

              <div
                class="card"
                onclick="selectTopic(${index})"
              >
                <div class="card-icon">📘</div>

                <div class="card-title">
                  ${escapeHtml(topic)}
                </div>

                <div class="card-info">
                  Voir les exercices de ce thème
                </div>

              </div>

            `).join("")}

          </div>

        </div>
      `
      :
      ""
    }

  `;
}


/* =========================================================
   9. ÉCRAN 5 — THÈME
========================================================= */

function selectTopic(index){

  const discipline=getDiscipline();

  state.topic =
    discipline.topics &&
    discipline.topics[index];

  setBreadcrumb([
    {label:"Mondo Quiz",action:"renderLevels()"},
    {label:getLevel().name,action:`selectLevel('${getLevel().id}')`},
    {label:getClass().name,action:`selectClass('${getClass().code}')`},
    {label:discipline.name,action:`selectDiscipline('${discipline.code}')`},
    {label:state.topic}
  ]);

  app.innerHTML=`

    <button
      class="back"
      onclick="selectDiscipline('${discipline.code}')"
    >
      ← Retour à ${escapeHtml(discipline.name)}
    </button>

    <h1 class="screen-title">
      📘 ${escapeHtml(state.topic)}
    </h1>

    <p class="screen-description">
      Exercices et questions correspondant à ce thème.
    </p>

    ${
      discipline.questions?.length
      ?
      `
        <div class="card" onclick="startQuestions()">

          <div class="card-icon">📝</div>

          <div class="card-title">
            Commencer l'exercice
          </div>

          <div class="card-info">
            Répondre aux questions de ${escapeHtml(state.topic)}
          </div>

        </div>
      `
      :
      `
        <div class="empty">
          <strong>Aucune question locale n'est encore associée à ce thème.</strong>
          <br><br>
          Le moteur Mondo Quiz peut charger ici les questions
          correspondant à ce thème depuis Supabase.
        </div>
      `
    }

  `;
}


/* =========================================================
   10. QUESTIONS
========================================================= */

function startQuestions(){

  const discipline=getDiscipline();

  state.questions =
    discipline.questions || [];

  state.questionIndex=0;
  state.score=0;
  state.answered=false;

  if(!state.questions.length){
    showMessage(
      "Aucune question n'est encore disponible pour cette sélection."
    );
    return;
  }

  renderQuestion();
}


function renderQuestion(){

  const q=state.questions[state.questionIndex];

  if(!q){
    renderResult();
    return;
  }

  state.answered=false;

  app.innerHTML=`

    <button
      class="back"
      onclick="selectDiscipline('${getDiscipline().code}')"
    >
      ← Retour à la discipline
    </button>

    <div class="question-box">

      <div class="question-number">
        QUESTION ${state.questionIndex+1}
        / ${state.questions.length}
      </div>

      <div class="question-text">
        ${escapeHtml(q.question)}
      </div>

      <div class="answers">

        ${q.options.map((option,index)=>`

          <button
            class="answer"
            onclick="answerQuestion(this,'${escapeJs(option)}')"
          >
            <strong>${String.fromCharCode(65+index)}.</strong>
            ${escapeHtml(option)}
          </button>

        `).join("")}

      </div>

      <div id="explanation" class="explanation"></div>

      <button
        id="nextButton"
        class="next"
        onclick="nextQuestion()"
      >
        Question suivante →
      </button>

    </div>
  `;
}


function escapeJs(value){
  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


function answerQuestion(button,answer){

  if(state.answered) return;

  state.answered=true;

  const q=state.questions[state.questionIndex];

  const buttons =
    document.querySelectorAll(".answer");

  buttons.forEach(btn=>{
    btn.disabled=true;

    if(btn.innerText.trim().endsWith(q.answer)){
      btn.classList.add("correct");
    }
  });

  if(answer===q.answer){
    state.score++;
    button.classList.add("correct");
  }else{
    button.classList.add("wrong");
  }

  const explanation =
    document.getElementById("explanation");

  explanation.style.display="block";

  explanation.innerHTML =
    `<strong>Explication :</strong> ${
      escapeHtml(q.explanation || "Réponse enregistrée.")
    }`;

  document.getElementById("nextButton")
    .style.display="inline-block";
}


function nextQuestion(){

  state.questionIndex++;

  if(state.questionIndex>=state.questions.length){
    renderResult();
  }else{
    renderQuestion();
  }
}


function renderResult(){

  const total=state.questions.length;

  app.innerHTML=`

    <div class="question-box">

      <div class="question-number">
        RÉSULTAT
      </div>

      <div class="question-text">
        ${state.score} / ${total}
      </div>

      <div class="status">
        Tu as obtenu
        <strong>${state.score}</strong>
        bonne(s) réponse(s) sur
        <strong>${total}</strong>.
      </div>

      <button
        class="next"
        style="display:inline-block"
        onclick="startQuestions()"
      >
        Recommencer
      </button>

      <button
        class="back"
        style="margin-left:8px"
        onclick="selectDiscipline('${getDiscipline().code}')"
      >
        Retour à la discipline
      </button>

    </div>
  `;
}


/* =========================================================
   11. SUPABASE : CHARGEMENT DU CATALOGUE
========================================================= */

async function loadSupabaseCatalog(){

  if(!supabaseClient){
    return;
  }

  try{

    const {data,error} =
      await supabaseClient.rpc(
        "mondo_quiz_curriculum_tree",
        {
          p_country_code:"BJ",
          p_education_level:null,
          p_search:null
        }
      );

    if(error){
      console.warn("Catalogue Supabase :",error);
      return;
    }

    if(!data || !Array.isArray(data.curricula)){
      return;
    }

    /*
      Le catalogue local reste immédiatement disponible.
      Les données Supabase pourront remplacer progressivement
      les structures locales lorsqu'elles sont suffisamment
      complètes.
    */

    console.log(
      "Catalogue pédagogique Supabase chargé :",
      data.curricula.length,
      "programme(s)"
    );

  }catch(error){

    console.warn(
      "Impossible de charger le catalogue Supabase :",
      error
    );

  }
}


/* =========================================================
   12. MESSAGE
========================================================= */

function showMessage(message){

  app.innerHTML=`

    <button class="back" onclick="renderLevels()">
      ← Retour aux niveaux
    </button>

    <div class="empty">
      ${escapeHtml(message)}
    </div>

  `;
}


/* =========================================================
   13. INITIALISATION
========================================================= */

async function init(){

  /*
    Important :
    on affiche immédiatement le catalogue local.
    Ainsi, Mondo Quiz ne peut pas rester bloqué sur
    "0 programme" à cause d'une requête réseau.
  */

  renderLevels();

  /*
    Supabase est chargé ensuite.
  */

  await loadSupabaseCatalog();

}

init();

</script>
